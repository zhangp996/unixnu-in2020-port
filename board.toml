schema_version = 2

[board]
name = "instantnoodlep"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 8 Pro IN2020, 8 GiB, 1080x2376, UFS root"
kit = "instantnoodlep"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "instantnoodlep_defconfig"
script = "scripts/build-xnu-16k-in2020.sh"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[device_tree]
source = "device:dts/board.dts"
include_dirs = ["soc:dts"]

[firmware]
# Replace with this board's UEFI configuration and paths.
config = "instantnoodlep"
dsc = "Platforms/OnePlus/instantnoodlepPkg/instantnoodlep.dsc"
fd = "Build/instantnoodlepPkg/{target}_GCC/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "instantnoodlep"

[payload]
panic_screen = true
volume = "UNIXNU"
size_mib = 60
loader = "firmware"
title = "UniXNU"
kernel_args = ["-v", "-enable_kprintf_spam", "startup_debug=1", "serial=3", "debug=0x14f", "cpus=1"]

[payload.adt]
# Supply the board's identity seed through --unique-chip-id.
chip_id = "356"
unique_chip_id = "00000000fa8620b3"
owned_memory_size = "0xC0000000"

[kernel.prelink]
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_KEBAB/mach.development.kebab.unstripped.noctf"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]
